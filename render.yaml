services:
  - type: web
    name: pocketsentinel
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: TATUM_API_KEY
        sync: false
      - key: TATUM_SUI_RPC
        value: https://sui-mainnet.gateway.tatum.io
      - key: MEMWAL_KEY
        sync: false
      - key: MEMWAL_ACCOUNT_ID
        sync: false
      - key: MEMWAL_SERVER_URL
        value: https://relayer.memory.walrus.xyz
      - key: MEMWAL_NAMESPACE
        value: pocketsentinel
